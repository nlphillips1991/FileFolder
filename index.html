<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileFold</title>
<style>
:root{--blue:#1769d2;--navy:#10294b;--paper:#d8ad70;--paper2:#c8995d;--bg:#edf4fb;--line:#ccd8e6;--danger:#c63838}*{box-sizing:border-box}body{margin:0;font:15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:#15243a;background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:230px 1fr 300px;grid-template-rows:72px 1fr}.top{grid-column:1/-1;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:12px 22px;gap:20px}.brand{font-size:29px;font-weight:800;color:var(--navy);min-width:190px}.brand span{color:var(--blue)}.search{flex:1;max-width:720px;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.status{margin-left:auto;color:#26714a}.side,.details{background:#fff;padding:18px;border-right:1px solid var(--line);overflow:auto}.details{border:0;border-left:1px solid var(--line)}.primary{width:100%;background:var(--blue);color:white;border:0;border-radius:10px;padding:11px;font-weight:700}.nav{margin:18px 0}.nav button,.folder-row{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px}.nav button:hover,.folder-row:hover,.folder-row.active{background:#e7f0fc}.folders-title{font-weight:700;display:flex;justify-content:space-between;align-items:center}.mini{border:0;background:#e5effc;border-radius:7px;padding:4px 8px}.workspace{padding:22px;overflow:auto}.folder-shell{min-height:600px;background:linear-gradient(135deg,#2379c9,#12548f);border-radius:20px;padding:32px;box-shadow:0 18px 40px #264c7730;display:grid;grid-template-columns:42% 58%;gap:16px}.cover{border-right:5px solid #173d63;display:flex;justify-content:center;align-items:center}.note{background:#fffff3;padding:25px;transform:rotate(-3deg);box-shadow:0 8px 14px #0002;max-width:230px;font:20px Georgia;color:#355}.divider-area{position:relative;padding-top:52px}.tabs{position:absolute;right:0;top:12px;display:flex;gap:5px;align-items:flex-end}.tab{border:0;background:var(--paper2);padding:12px 16px;border-radius:10px 10px 0 0;color:#352410}.tab.active{background:#edca94;font-weight:800;padding-top:17px}.paper{background:linear-gradient(120deg,#e5bd84,#c9995e);border-radius:8px;min-height:485px;padding:28px;box-shadow:0 10px 22px #0003;position:relative}.paper h2{margin:0 0 18px}.drop{border:2px dashed #8f693d;border-radius:12px;padding:18px;text-align:center;margin-bottom:16px;color:#65441e}.drop.drag{background:#fff4d8}.doc{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fffdf8;border-radius:9px;padding:11px;margin:8px 0;box-shadow:0 2px 5px #0001}.doc:hover{outline:2px solid #2a73c5}.doc .icon{font-size:24px}.doc small{display:block;color:#6c7785}.doc-actions button{border:0;background:transparent;font-size:17px}.empty{text-align:center;padding:70px 15px;color:#795a36}.details h2{margin-top:4px}.preview{height:280px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#f7f9fc}.preview img,.preview iframe{width:100%;height:100%;border:0;object-fit:contain}.meta{margin-top:17px}.meta div{padding:8px 0;border-bottom:1px solid #e7edf4}.details-actions{display:grid;gap:8px;margin-top:16px}.details-actions button{padding:10px;border:1px solid var(--line);background:#fff;border-radius:9px}.danger{color:var(--danger)}dialog{border:0;border-radius:14px;padding:22px;box-shadow:0 20px 60px #0005;width:min(460px,90vw)}dialog input{width:100%;padding:10px;margin:12px 0;border:1px solid var(--line);border-radius:8px}.dlg-buttons{display:flex;justify-content:flex-end;gap:8px}.dlg-buttons button{padding:8px 14px;border-radius:8px;border:1px solid var(--line)}@media(max-width:900px){.app{grid-template-columns:180px 1fr}.details{display:none}.folder-shell{grid-template-columns:1fr}.cover{display:none}}@media(max-width:620px){.app{display:block}.top{position:sticky;top:0;z-index:5}.brand{min-width:auto;font-size:22px}.status{display:none}.side{display:none}.workspace{padding:10px}.folder-shell{padding:14px}.tabs{position:static;overflow:auto}.divider-area{padding-top:0}.tab{white-space:nowrap}.paper{padding:16px}}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><span>▰</span> FileFold</div><input id="search" class="search" placeholder="Search documents, folders, or content…"><div class="status">● Saved locally</div></header>
<aside class="side"><button class="primary" id="newFolder">＋ New Folder</button><div class="nav"><button data-view="all">⌂ All Documents</button><button data-view="recent">◷ Recent</button><button data-view="starred">☆ Starred</button></div><div class="folders-title">My Folders <button class="mini" id="addFolder">＋</button></div><div id="folderList"></div></aside>
<main class="workspace"><section class="folder-shell"><div class="cover"><div class="note">Keep important documents close and chaos away.</div></div><div class="divider-area"><div class="tabs" id="tabs"></div><div class="paper"><h2 id="currentTitle"></h2><div class="drop" id="drop">Drag files here or <label style="text-decoration:underline;cursor:pointer">browse<input id="fileInput" type="file" multiple hidden></label></div><div id="documents"></div></div></div></section></main>
<aside class="details" id="details"><h2>Document details</h2><p>Select a document to preview and manage it.</p></aside></div>
<dialog id="prompt"><form method="dialog"><h3 id="promptTitle">Name</h3><input id="promptInput" required><div class="dlg-buttons"><button value="cancel">Cancel</button><button value="ok" class="primary" style="width:auto">Save</button></div></form></dialog>
<script>
const DB='filefold-db',STORE='files'; let state=JSON.parse(localStorage.filefoldState||'null')||{folders:[{id:'personal',name:'Personal',tabs:['General','Receipts','Records']},{id:'work',name:'Work',tabs:['Contracts','Invoices','Reports','HR']}],folder:'work',tab:'Contracts',selected:null,view:'folder',query:''};
const $=s=>document.querySelector(s); const save=()=>localStorage.filefoldState=JSON.stringify(state); let db;
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function allFiles(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putFile(f){return new Promise((res,rej)=>{let r=tx('readwrite').put(f);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function deleteFile(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function makeId(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'ff-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function showImportError(e){let d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:90px;transform:translateX(-50%);z-index:9999;background:#fff0f0;color:#8a1717;border:1px solid #e2a3a3;padding:12px 16px;border-radius:10px;box-shadow:0 8px 28px #0003;max-width:88vw';d.textContent='Could not add document: '+(e?.message||e||'browser storage error');document.body.append(d);setTimeout(()=>d.remove(),8000)}
function folder(){return state.folders.find(f=>f.id===state.folder)||state.folders[0]}
async function promptFor(title,value=''){let d=$('#prompt');$('#promptTitle').textContent=title;$('#promptInput').value=value;d.showModal();setTimeout(()=>$('#promptInput').focus());return new Promise(res=>d.addEventListener('close',()=>res(d.returnValue==='ok'?$('#promptInput').value.trim():null),{once:true}))}
async function render(){save();let fs=await allFiles();let folders=$('#folderList');folders.innerHTML='';state.folders.forEach(f=>{let b=document.createElement('button');b.className='folder-row '+(state.folder===f.id?'active':'');b.textContent='📁 '+f.name;b.onclick=()=>{state.folder=f.id;state.tab=f.tabs[0];state.view='folder';state.selected=null;render()};b.oncontextmenu=async e=>{e.preventDefault();let n=await promptFor('Rename folder',f.name);if(n){f.name=n;render()}};folders.append(b)});let F=folder();$('#currentTitle').textContent=F.name+' / '+state.tab;let tabs=$('#tabs');tabs.innerHTML='';F.tabs.forEach(t=>{let b=document.createElement('button');b.className='tab '+(state.tab===t?'active':'');b.textContent=t;b.onclick=()=>{state.tab=t;state.view='folder';state.selected=null;render()};b.oncontextmenu=async e=>{e.preventDefault();let n=await promptFor('Rename divider',t);if(n){fs.filter(x=>x.folder===F.id&&x.tab===t).forEach(x=>{x.tab=n;putFile(x)});F.tabs[F.tabs.indexOf(t)]=n;state.tab=n;render()}};tabs.append(b)});let add=document.createElement('button');add.className='tab';add.textContent='＋';add.title='Add divider';add.onclick=addTab;tabs.append(add);
let q=state.query.toLowerCase();let shown=fs.filter(x=>!q||x.name.toLowerCase().includes(q)||x.type.toLowerCase().includes(q));if(state.view==='folder')shown=shown.filter(x=>x.folder===state.folder&&x.tab===state.tab);if(state.view==='starred')shown=shown.filter(x=>x.starred);if(state.view==='recent')shown=shown.sort((a,b)=>b.added-a.added).slice(0,20);let docs=$('#documents');docs.innerHTML='';if(!shown.length)docs.innerHTML='<div class="empty">No documents here yet.<br>Drop a file above to place it behind this divider.</div>';shown.forEach(x=>{let row=document.createElement('div');row.className='doc';row.draggable=true;row.innerHTML=`<div class="icon">${icon(x.type)}</div><div><b></b><small>${size(x.size)} · ${new Date(x.added).toLocaleDateString()}</small></div><div class="doc-actions"><button title="Star">${x.starred?'★':'☆'}</button></div>`;row.querySelector('b').textContent=x.name;row.onclick=()=>{state.selected=x.id;renderDetails(x)};row.querySelector('button').onclick=async e=>{e.stopPropagation();x.starred=!x.starred;await putFile(x);render()};docs.append(row)});if(state.selected){let x=fs.find(f=>f.id===state.selected);if(x)renderDetails(x)} }
function icon(t){return t.includes('pdf')?'📕':t.includes('image')?'🖼️':t.includes('word')||t.includes('text')?'📘':'📄'} function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
async function importFiles(list){try{for(let f of list){let bytes=await f.arrayBuffer();let blob=new Blob([bytes],{type:f.type||'application/octet-stream'});await putFile({id:makeId(),name:f.name,type:f.type||'application/octet-stream',size:f.size,added:Date.now(),folder:state.folder,tab:state.tab,starred:false,blob})}$('#fileInput').value='';await render()}catch(e){console.error(e);showImportError(e)}}
function renderDetails(x){let url=URL.createObjectURL(x.blob),preview=x.type.startsWith('image/')?`<img src="${url}">`:x.type==='application/pdf'?`<iframe src="${url}"></iframe>`:`<div style="font-size:64px">${icon(x.type)}</div>`;let D=$('#details');D.innerHTML=`<h2></h2><div class="preview">${preview}</div><div class="meta"><div><b>Type</b><br>${x.type||'Unknown'}</div><div><b>Size</b><br>${size(x.size)}</div><div><b>Filed in</b><br>${folderName(x.folder)} / ${x.tab}</div></div><div class="details-actions"><button id="openDoc">Open document</button><button id="renameDoc">Rename</button><button id="moveDoc">Move to another divider</button><button id="deleteDoc" class="danger">Delete</button></div>`;D.querySelector('h2').textContent=x.name;$('#openDoc').onclick=()=>window.open(url,'_blank');$('#renameDoc').onclick=async()=>{let n=await promptFor('Rename document',x.name);if(n){x.name=n;await putFile(x);render()}};$('#moveDoc').onclick=async()=>{let opts=state.folders.flatMap(f=>f.tabs.map(t=>`${f.name} / ${t}`));let n=await promptFor('Move to: '+opts.join(', '),folderName(x.folder)+' / '+x.tab);let target=state.folders.flatMap(f=>f.tabs.map(t=>({f,t,label:f.name+' / '+t}))).find(v=>v.label.toLowerCase()===String(n).toLowerCase());if(target){x.folder=target.f.id;x.tab=target.t;await putFile(x);state.selected=null;render()}};$('#deleteDoc').onclick=async()=>{if(confirm('Delete '+x.name+'?')){await deleteFile(x.id);state.selected=null;render()}}}
function folderName(id){return state.folders.find(f=>f.id===id)?.name||'Unknown'}
async function addFolder(){let n=await promptFor('New folder name');if(n){let id=makeId();state.folders.push({id,name:n,tabs:['General']});state.folder=id;state.tab='General';render()}}async function addTab(){let n=await promptFor('New divider name');if(n&&!folder().tabs.includes(n)){folder().tabs.push(n);state.tab=n;render()}}
$('#newFolder').onclick=$('#addFolder').onclick=addFolder;$('#fileInput').onchange=e=>importFiles(e.target.files);$('#search').oninput=e=>{state.query=e.target.value;render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.selected=null;render()});let drop=$('#drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>importFiles(e.dataTransfer.files);openDB().then(render).catch(e=>alert('Could not start local storage: '+e.message));
</script></body></html>
